[package]
name = "meshcore-rs"
version = "0.1.10"
edition = "2021"
description = "Rust library for communicating with MeshCore companion radio nodes"
license = "MIT"
repository = "https://github.com/andrewdavidmackenzie/meshcore-rs"
keywords = ["meshcore", "lora", "mesh", "radio"]
categories = ["network-programming", "embedded", "hardware-support"]

[dependencies]
tokio = { version = "1", features = ["full", "sync", "time", "io-util"] }
tokio-serial = { version = "5", optional = true }
tokio-stream = { version = "0.1", features = ["sync"] }
thiserror = "2"
bytes = "1"
tracing = "0.1"
futures = "0.3"

# BLE support (optional)
btleplug = { version = "0.12.0", optional = true }
uuid = { version = "1" }

[features]
default = ["serial", "tcp", "ble"]
serial = ["dep:tokio-serial"]
tcp = []
ble = ["btleplug"]

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Declared explicitly so `required-features` can be set; without it Cargo
# auto-discovers this example and tries to build it even when `serial` is off,
# where `MeshCore::serial` does not exist.
[[example]]
name = "serial_usb"
required-features = ["serial"]

[[example]]
name = "rf_packet_monitor"
